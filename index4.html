<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Telegram Bot — Live Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0e1621;
      color: #e4e6eb;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: #17212b;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #0e1621;
      flex-shrink: 0;
    }
    .header-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #2b5278;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .header-info h1 { font-size: 16px; font-weight: 600; }
    .header-info span { font-size: 13px; color: #8b98a5; }

    /* Область сообщений */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      background: #0e1621;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
      position: relative;
    }
    .msg.in {
      align-self: flex-start;
      background: #182533;
      border-bottom-left-radius: 4px;
    }
    .msg.out {
      align-self: flex-end;
      background: #2b5278;
      border-bottom-right-radius: 4px;
    }
    .msg .time {
      font-size: 11px;
      color: #8b98a5;
      margin-top: 4px;
      text-align: right;
    }
    .msg .sender {
      font-size: 13px;
      color: #64b5ef;
      margin-bottom: 2px;
      font-weight: 500;
    }
    .msg img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 4px;
      display: block;
    }
    .msg .caption { margin-top: 4px; }

    .empty-hint {
      margin: auto;
      text-align: center;
      color: #6b7a8a;
      font-size: 14px;
      padding: 20px;
    }

    /* Превью */
    .preview-bar {
      background: #17212b;
      padding: 10px 16px;
      display: none;
      align-items: center;
      gap: 12px;
      border-top: 1px solid #0e1621;
    }
    .preview-bar.show { display: flex; }
    .preview-img {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 8px;
    }
    .preview-info { flex: 1; font-size: 13px; color: #8b98a5; }
    .preview-remove {
      background: none; border: none; color: #e74c3c;
      font-size: 22px; cursor: pointer; padding: 4px 8px;
    }

    .format-row {
      display: flex; gap: 6px;
      padding: 6px 16px 0;
      background: #17212b;
    }
    .format-btn {
      background: #242f3d; border: none; color: #8b98a5;
      font-size: 12px; padding: 4px 10px; border-radius: 12px; cursor: pointer;
    }
    .format-btn.active { background: #2b5278; color: white; }

    .input-bar {
      background: #17212b;
      padding: 10px 12px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      border-top: 1px solid #0e1621;
      flex-shrink: 0;
    }
    .attach-btn {
      background: none; border: none; color: #8b98a5;
      font-size: 26px; cursor: pointer; padding: 6px; line-height: 1;
    }
    .attach-btn:hover { color: #64b5ef; }

    .text-input-wrap {
      flex: 1;
      background: #242f3d;
      border-radius: 20px;
      padding: 10px 16px;
      min-height: 42px;
      max-height: 140px;
      overflow-y: auto;
    }
    #message {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #e4e6eb;
      font-size: 15px;
      line-height: 1.4;
      resize: none;
      font-family: inherit;
      max-height: 120px;
    }
    #message::placeholder { color: #6b7a8a; }

    .send-btn {
      width: 42px; height: 42px; border-radius: 50%;
      background: #2b5278; border: none; color: white;
      font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .send-btn:hover { background: #3a6a94; }
    .send-btn:disabled { background: #1e2c3a; color: #5a6a7a; cursor: not-allowed; }

    .status {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 100;
      display: none;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .status.success { background: #1e3a2f; color: #4ade80; display: block; }
    .status.error   { background: #3a1e1e; color: #f87171; display: block; }
    .status.info    { background: #1e2a3a; color: #60a5fa; display: block; }

    #photoFile { display: none; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-avatar">🤖</div>
    <div class="header-info">
      <h1>Бот • Live</h1>
      <span id="statusText">подключение...</span>
    </div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="empty-hint" id="emptyHint">
      Ожидаю сообщения...<br>
      <small>Сообщения появятся здесь автоматически</small>
    </div>
  </div>

  <div class="preview-bar" id="previewBar">
    <img id="previewImg" class="preview-img" alt="preview">
    <div class="preview-info" id="previewName">Картинка</div>
    <button class="preview-remove" onclick="removePhoto()">×</button>
  </div>

  <div class="format-row">
    <button class="format-btn active" data-mode="" onclick="setParseMode(this)">Текст</button>
    <button class="format-btn" data-mode="HTML" onclick="setParseMode(this)">HTML</button>
    <button class="format-btn" data-mode="Markdown" onclick="setParseMode(this)">Markdown</button>
  </div>

  <div class="input-bar">
    <button class="attach-btn" onclick="document.getElementById('photoFile').click()" title="Прикрепить">📎</button>
    <div class="text-input-wrap">
      <textarea id="message" rows="1" placeholder="Сообщение..." oninput="autoResize(this)"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" onclick="send()">➤</button>
  </div>

  <input type="file" id="photoFile" accept="image/*" onchange="handleFile(event)">
  <div id="status" class="status"></div>

  <script>
    // ====================== НАСТРОЙКИ ======================
    const BOT_TOKEN = "8815339448:AAFwizdVxZ7RFTZ-j8W7vQmo0G5GcDWPY7Y";   // ← сюда токен
    const CHAT_ID   = "-5144489364";          // уже зашит
    // =======================================================

    let selectedFile = null;
    let parseMode = "";
    let offset = 0;               // для getUpdates
    let isPolling = false;

    // ---------- UI helpers ----------
    function setParseMode(btn) {
      document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      parseMode = btn.dataset.mode;
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      selectedFile = file;
      document.getElementById('previewImg').src = URL.createObjectURL(file);
      document.getElementById('previewName').textContent =
        file.name.length > 28 ? file.name.slice(0, 25) + '…' : file.name;
      document.getElementById('previewBar').classList.add('show');
    }

    function removePhoto() {
      selectedFile = null;
      document.getElementById('photoFile').value = '';
      document.getElementById('previewBar').classList.remove('show');
    }

    function showStatus(text, type) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = 'status ' + type;
      if (type !== 'info') setTimeout(() => el.style.display = 'none', 3000);
    }

    function scrollToBottom() {
      const area = document.getElementById('chatArea');
      area.scrollTop = area.scrollHeight;
    }

    function formatTime(ts) {
      const d = new Date(ts * 1000);
      return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    // ---------- Отображение сообщений ----------
    function addMessage(opts) {
      // opts: { text, isOut, sender, time, photoUrl }
      const hint = document.getElementById('emptyHint');
      if (hint) hint.remove();

      const div = document.createElement('div');
      div.className = 'msg ' + (opts.isOut ? 'out' : 'in');

      let html = '';
      if (opts.sender && !opts.isOut) {
        html += `<div class="sender">${escapeHtml(opts.sender)}</div>`;
      }
      if (opts.photoUrl) {
        html += `<img src="${opts.photoUrl}" alt="photo" loading="lazy">`;
      }
      if (opts.text) {
        html += `<div class="${opts.photoUrl ? 'caption' : ''}">${opts.text}</div>`;
      }
      html += `<div class="time">${opts.time || ''}</div>`;

      div.innerHTML = html;
      document.getElementById('chatArea').appendChild(div);
      scrollToBottom();
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ---------- Получение обновлений (long-polling) ----------
    async function pollUpdates() {
      if (isPolling) return;
      isPolling = true;

      document.getElementById('statusText').textContent = 'онлайн';

      while (true) {
        try {
          const url = `https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${offset}&timeout=25&allowed_updates=["message"]`;
          const res = await fetch(url);
          const data = await res.json();

          if (!data.ok) {
            document.getElementById('statusText').textContent = 'ошибка API';
            await sleep(5000);
            continue;
          }

          for (const upd of data.result) {
            offset = upd.update_id + 1;

            const msg = upd.message;
            if (!msg) continue;

            // Только нужный чат
            if (String(msg.chat.id) !== String(CHAT_ID)) continue;

            // Определяем, от кого
            let sender = '';
            if (msg.from) {
              sender = msg.from.first_name || '';
              if (msg.from.last_name) sender += ' ' + msg.from.last_name;
              if (msg.from.username) sender += ` (@${msg.from.username})`;
            }

            // Фото
            let photoUrl = null;
            if (msg.photo && msg.photo.length) {
              // Берём самое большое фото
              const fileId = msg.photo[msg.photo.length - 1].file_id;
              // Получаем ссылку на файл
              try {
                const fRes = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${fileId}`);
                const fData = await fRes.json();
                if (fData.ok) {
                  photoUrl = `https://api.telegram.org/file/bot${BOT_TOKEN}/${fData.result.file_path}`;
                }
              } catch (e) {}
            }

            const text = msg.caption || msg.text || (photoUrl ? '' : '[медиа]');
            const isOut = msg.from && msg.from.is_bot; // сообщения самого бота

            addMessage({
              text: text ? escapeHtml(text).replace(/\n/g, '<br>') : '',
              isOut,
              sender: isOut ? null : sender,
              time: formatTime(msg.date),
              photoUrl
            });
          }
        } catch (err) {
          console.error(err);
          document.getElementById('statusText').textContent = 'переподключение...';
          await sleep(3000);
        }
      }
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    // ---------- Отправка ----------
    async function send() {
      const btn = document.getElementById('sendBtn');
      const text = document.getElementById('message').value.trim();

      if (!text && !selectedFile) {
        showStatus('Напиши текст или прикрепи картинку', 'error');
        return;
      }
      if (BOT_TOKEN.includes('ВСТАВЬ')) {
        showStatus('Вставь токен бота в код!', 'error');
        return;
      }

      btn.disabled = true;
      showStatus('Отправляю...', 'info');

      try {
        let res, data;

        if (selectedFile) {
          const formData = new FormData();
          formData.append('chat_id', CHAT_ID);
          formData.append('photo', selectedFile);
          if (text) formData.append('caption', text);
          if (parseMode) formData.append('parse_mode', parseMode);

          res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
          });
        } else {
          const body = { chat_id: CHAT_ID, text };
          if (parseMode) body.parse_mode = parseMode;

          res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
        }

        data = await res.json();
        if (!data.ok) throw new Error(data.description || 'Ошибка API');

        // Сразу показываем своё сообщение
        const now = Math.floor(Date.now() / 1000);
        if (selectedFile) {
          addMessage({
            text: text ? escapeHtml(text).replace(/\n/g, '<br>') : '',
            isOut: true,
            time: formatTime(now),
            photoUrl: URL.createObjectURL(selectedFile)
          });
        } else {
          addMessage({
            text: escapeHtml(text).replace(/\n/g, '<br>'),
            isOut: true,
            time: formatTime(now)
          });
        }

        // Очистка
        document.getElementById('message').value = '';
        document.getElementById('message').style.height = 'auto';
        removePhoto();
        showStatus('✅ Отправлено', 'success');

      } catch (err) {
        showStatus('❌ ' + err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    // Enter = отправить
    document.getElementById('message').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    // Запуск
    if (!BOT_TOKEN.includes('ВСТАВЬ')) {
      pollUpdates();
    } else {
      document.getElementById('statusText').textContent = 'вставь токен';
    }
  </script>
</body>
</html>
