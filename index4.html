<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Telegram Bot Sender</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0e1621;
      color: #e4e6eb;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Шапка */
    .header {
      background: #17212b;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #0e1621;
      flex-shrink: 0;
    }
    .header-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #2b5278;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .header-info h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .header-info span {
      font-size: 13px;
      color: #8b98a5;
    }

    /* Область сообщений (пока пустая, просто фон) */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #0e1621;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .empty-hint {
      text-align: center;
      color: #6b7a8a;
      font-size: 14px;
      margin: auto;
      padding: 20px;
    }

    /* Превью прикреплённой картинки */
    .preview-bar {
      background: #17212b;
      padding: 10px 16px;
      display: none;
      align-items: center;
      gap: 12px;
      border-top: 1px solid #0e1621;
    }
    .preview-bar.show { display: flex; }
    .preview-img {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 8px;
    }
    .preview-info {
      flex: 1;
      font-size: 13px;
      color: #8b98a5;
    }
    .preview-remove {
      background: none;
      border: none;
      color: #e74c3c;
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
    }

    /* Нижняя панель ввода */
    .input-bar {
      background: #17212b;
      padding: 10px 12px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      border-top: 1px solid #0e1621;
      flex-shrink: 0;
    }

    .attach-btn {
      background: none;
      border: none;
      color: #8b98a5;
      font-size: 26px;
      cursor: pointer;
      padding: 6px;
      line-height: 1;
      transition: color 0.2s;
    }
    .attach-btn:hover { color: #64b5ef; }

    .text-input-wrap {
      flex: 1;
      background: #242f3d;
      border-radius: 20px;
      padding: 10px 16px;
      min-height: 42px;
      max-height: 140px;
      overflow-y: auto;
    }
    #message {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #e4e6eb;
      font-size: 15px;
      line-height: 1.4;
      resize: none;
      font-family: inherit;
      max-height: 120px;
    }
    #message::placeholder { color: #6b7a8a; }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #2b5278;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .send-btn:hover { background: #3a6a94; }
    .send-btn:disabled {
      background: #1e2c3a;
      color: #5a6a7a;
      cursor: not-allowed;
    }

    /* Статус */
    .status {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 100;
      display: none;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .status.success { background: #1e3a2f; color: #4ade80; display: block; }
    .status.error   { background: #3a1e1e; color: #f87171; display: block; }
    .status.info    { background: #1e2a3a; color: #60a5fa; display: block; }

    /* Скрытый input файла */
    #photoFile { display: none; }

    /* Форматирование (маленькая кнопка) */
    .format-row {
      display: flex;
      gap: 6px;
      padding: 6px 16px 0;
      background: #17212b;
    }
    .format-btn {
      background: #242f3d;
      border: none;
      color: #8b98a5;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
    }
    .format-btn.active {
      background: #2b5278;
      color: white;
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <div class="header">
    <div class="header-avatar">🤖</div>
    <div class="header-info">
      <h1>Отправка от бота</h1>
      <span>Сообщения уходят сразу в чат</span>
    </div>
  </div>

  <!-- Область чата -->
  <div class="chat-area">
    <div class="empty-hint">
      Напиши сообщение и/или прикрепи картинку,<br>
      затем нажми ➤
    </div>
  </div>

  <!-- Превью картинки -->
  <div class="preview-bar" id="previewBar">
    <img id="previewImg" class="preview-img" alt="preview">
    <div class="preview-info" id="previewName">Картинка</div>
    <button class="preview-remove" onclick="removePhoto()">×</button>
  </div>

  <!-- Выбор форматирования -->
  <div class="format-row">
    <button class="format-btn active" data-mode="" onclick="setParseMode(this)">Текст</button>
    <button class="format-btn" data-mode="HTML" onclick="setParseMode(this)">HTML</button>
    <button class="format-btn" data-mode="Markdown" onclick="setParseMode(this)">Markdown</button>
  </div>

  <!-- Нижняя панель -->
  <div class="input-bar">
    <button class="attach-btn" onclick="document.getElementById('photoFile').click()" title="Прикрепить картинку">📎</button>
    
    <div class="text-input-wrap">
      <textarea id="message" rows="1" placeholder="Сообщение..." oninput="autoResize(this)"></textarea>
    </div>
    
    <button class="send-btn" id="sendBtn" onclick="send()" title="Отправить">➤</button>
  </div>

  <input type="file" id="photoFile" accept="image/*" onchange="handleFile(event)">

  <div id="status" class="status"></div>

  <script>
    // ====================== НАСТРОЙКИ ======================
    // Вставь сюда свой токен бота
    const BOT_TOKEN = "8815339448:AAFwizdVxZ7RFTZ-j8W7vQmo0G5GcDWPY7Y";
    
    // Chat ID уже зашит
    const CHAT_ID = "-5144489364";
    // =======================================================

    let selectedFile = null;
    let parseMode = "";

    function setParseMode(btn) {
      document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      parseMode = btn.dataset.mode;
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      selectedFile = file;
      const preview = document.getElementById('previewImg');
      preview.src = URL.createObjectURL(file);
      
      document.getElementById('previewName').textContent = file.name.length > 30 
        ? file.name.slice(0, 27) + '...' 
        : file.name;
      
      document.getElementById('previewBar').classList.add('show');
    }

    function removePhoto() {
      selectedFile = null;
      document.getElementById('photoFile').value = '';
      document.getElementById('previewBar').classList.remove('show');
      document.getElementById('previewImg').src = '';
    }

    function showStatus(text, type) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = 'status ' + type;
      if (type === 'success' || type === 'error') {
        setTimeout(() => { el.style.display = 'none'; }, 3500);
      }
    }

    async function send() {
      const btn = document.getElementById('sendBtn');
      const text = document.getElementById('message').value.trim();

      if (!text && !selectedFile) {
        showStatus('Напиши текст или прикрепи картинку', 'error');
        return;
      }

      if (BOT_TOKEN === "ВСТАВЬ_СВОЙ_ТОКЕН" || !BOT_TOKEN) {
        showStatus('Сначала вставь токен бота в код!', 'error');
        return;
      }

      btn.disabled = true;
      showStatus('Отправляю...', 'info');

      try {
        let res, data;

        if (selectedFile) {
          // Отправка фото с подписью
          const formData = new FormData();
          formData.append('chat_id', CHAT_ID);
          formData.append('photo', selectedFile);
          if (text) formData.append('caption', text);
          if (parseMode) formData.append('parse_mode', parseMode);

          res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
          });
        } else {
          // Обычный текст
          const body = {
            chat_id: CHAT_ID,
            text: text
          };
          if (parseMode) body.parse_mode = parseMode;

          res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
        }

        data = await res.json();

        if (!data.ok) {
          throw new Error(data.description || 'Ошибка API Telegram');
        }

        // Очистка после успешной отправки
        document.getElementById('message').value = '';
        document.getElementById('message').style.height = 'auto';
        removePhoto();
        showStatus('✅ Отправлено!', 'success');

      } catch (err) {
        showStatus('❌ ' + err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    // Enter — отправить, Shift+Enter — новая строка
    document.getElementById('message').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
  </script>
</body>
</html>
